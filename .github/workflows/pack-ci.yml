name: pack-ci
on: [push, pull_request]
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - run: python tools/check_pack_consistency.py
      # The selftest runs the checker red as well as green: it asserts that
      # silent omission, drifted citations, an out-of-sync diagram, and a
      # snake_case manifest key each FAIL. A green-only run proves nothing.
      - name: deterministic-layer selftest
        run: python tools/selftest/run_selftest.py
      # The tool regression runner executes the pack tools against golden
      # fixtures and asserts expected output. Hard-fails on zero cases.
      - name: tool regression tests
        run: python tools/run_tool_tests.py
      # The reachability checker runs semantic analysis on the sidecar.
      # It verifies all states are reachable and terminal states are marked.
      - name: reachability check (golden-mini)
        run: |
          python tools/gen_analysis_sidecar.py --root . --analysis-dir tests/golden-mini/domain-analysis mini
          python tools/check_reachability.py tests/golden-mini/domain-analysis/mini
