name: pack-ci
on: [push, pull_request]
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # ste-pack is a PRIVATE repository. GITHUB_TOKEN cannot read it, so the
      # submodule checkout runs over SSH with a read-only deploy key registered
      # on ste-pack. The private key lives in the STE_PACK_SSH_KEY secret.
      - name: Checkout ste-pack submodule (private, via deploy key)
        env:
          STE_PACK_SSH_KEY: ${{ secrets.STE_PACK_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$STE_PACK_SSH_KEY" > ~/.ssh/ste_pack_deploy
          chmod 600 ~/.ssh/ste_pack_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/ste_pack_deploy -o IdentitiesOnly=yes"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - run: python tools/check_pack_consistency.py
      # The selftest runs the checker red as well as green: it asserts that
      # silent omission, drifted citations, an out-of-sync diagram, and a
      # snake_case manifest key each FAIL. A green-only run proves nothing.
      - name: deterministic-layer selftest
        run: python tools/selftest/run_selftest.py
