name: pack-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements-dev.txt
      - run: python tools/check_pack_consistency.py
      # The rules-registry selftest proves gen_rules --check can go red:
      # a checker rule without a selftest, an unknown fault id, and a
      # drifted generated block must each fail.
      - name: rules registry selftest
        run: python tools/gen_rules.py --selftest
      # The selftest runs the checker red as well as green: it asserts that
      # silent omission, drifted citations, an out-of-sync diagram, and a
      # snake_case manifest key each FAIL. A green-only run proves nothing.
      - name: deterministic-layer selftest
        run: python tools/selftest/run_selftest.py
      # The tool regression runner executes the pack tools against golden
      # fixtures and asserts expected output. Hard-fails on zero cases.
      - name: tool regression tests
        run: python tools/run_tool_tests.py
      # The reachability checker runs semantic analysis on the sidecar.
      # It verifies all states are reachable and terminal states are marked.
      #
      # --root must scope the generator to the component. With --root . it
      # walks the whole repo, and tools/selftest/src/mini.py shadows
      # tests/golden-mini/src/mini.py (first hit wins, unsorted walk), so every
      # citation is emitted against the wrong file. dsc_check below is what
      # makes that visible: before this was fixed, the regenerated sidecar
      # carried 12x "citation: tools/selftest/src/mini.py does not exist" and
      # nothing in CI looked, because reachability reads only states and events.
      - name: reachability check (golden-mini)
        run: |
          python tools/gen_analysis_sidecar.py --root tests/golden-mini
          python tools/dsc_check.py tests/golden-mini/domain-analysis/mini --repo tests/golden-mini
          python tools/check_reachability.py tests/golden-mini/domain-analysis/mini
