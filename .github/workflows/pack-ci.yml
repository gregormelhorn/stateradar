name: pack-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The pack-wide mypy pass also checks the optional GEPA adapter.
      - run: pip install -r tools/requirements-dev.txt -r docs/evidence/gepa-bounded/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/weighted-semaphore/go.mod
          cache: false
      - name: reusable late-completion oracle and addrConn reference
        run: |
          python tools/selftest/test_late_workflow.py
          python tools/gobreaker_late_readiness.py
          python tools/selftest/test_late_completion.py
          python tools/selftest/test_late_adapter.py
          python tools/addrconn_late.py
      - name: pinned addrConn backoff slice and decisions
        run: |
          python tools/selftest/test_addrconn_f09.py
          python tools/addrconn_f09.py
      - name: weighted semaphore accepted decisions
        run: python examples/weighted-semaphore/verify_q01.py
      - name: weighted semaphore current model and cells
        run: python examples/weighted-semaphore/domain-analysis/weightedSemaphore/verify.py
      - name: semaphore F-09 observability and weak/full comparison
        run: |
          python tools/selftest/test_semaphore_f09.py
          python tools/semaphore_f09.py
      - name: weighted semaphore mutation binding
        run: |
          python tools/gen_mutant_variants.py examples/weighted-semaphore/domain-analysis/weightedSemaphore --check
          python tools/check_matrix_mutation.py examples/weighted-semaphore/domain-analysis/weightedSemaphore
          python tools/check_fault_mutants.py examples/weighted-semaphore/domain-analysis/weightedSemaphore
      - name: mutation verdict and cell rationale selftests
        run: |
          python tools/selftest/test_fault_runner.py
          python docs/evidence/generic-canary/scripts/semaphore_weak_control.py
          python tools/selftest/test_mutation_binding.py
          python tools/selftest/test_cell_rationale.py
          python tools/selftest/test_finding_benchmark.py
          python tools/selftest/test_finding_preservation.py
          python tools/selftest/test_postreview_evidence.py
      # mypy over tools/ and tools/selftest/ (config: mypy.ini). Its first
      # run on main found 34 errors, one a real crash: both mutation
      # runners died on bytes + str in their timeout path.
      - name: type check
        run: mypy
      - run: python tools/check_pack_consistency.py
      # The rules-registry selftest proves gen_rules --check can go red:
      # a checker rule without a selftest, an unknown fault id, and a
      # drifted generated block must each fail.
      - name: rules registry selftest
        run: python tools/gen_rules.py --selftest
      # The selftest runs the checker red as well as green: it asserts that
      # silent omission, drifted citations, an out-of-sync diagram, and a
      # snake_case manifest key each FAIL. A green-only run proves nothing.
      - name: deterministic-layer selftest
        run: python tools/selftest/run_selftest.py
      - name: local model routing selftests
        run: |
          python tools/selftest/test_local_budget.py
          python tools/selftest/test_local_models.py
          python tools/selftest/test_jev_local.py
          python tools/selftest/test_jev_eval.py
          python tools/selftest/test_draft_verify.py
          python tools/selftest/test_draft_cells.py
          python tools/selftest/test_pilot_artifacts.py
          python tools/selftest/test_run_sol_pilot.py
          python tools/selftest/test_pilot_accounting.py
          python tools/selftest/test_run_flash_pilot.py
          python tools/selftest/test_hybrid_pilot.py
      # The tool regression runner executes the pack tools against golden
      # fixtures and asserts expected output. Hard-fails on zero cases.
      - name: tool regression tests
        run: python tools/run_tool_tests.py
      # The reachability checker runs semantic analysis on the sidecar.
      # It verifies all states are reachable and terminal states are marked.
      #
      # --root must scope the generator to the component. With --root . it
      # walks the whole repo, and tools/selftest/src/mini.py shadows
      # tests/golden-mini/src/mini.py (first hit wins, unsorted walk), so every
      # citation is emitted against the wrong file. dsc_check below is what
      # makes that visible: before this was fixed, the regenerated sidecar
      # carried 12x "citation: tools/selftest/src/mini.py does not exist" and
      # nothing in CI looked, because reachability reads only states and events.
      - name: reachability check (golden-mini)
        run: |
          python tools/gen_analysis_sidecar.py --root tests/golden-mini
          python tools/dsc_check.py tests/golden-mini/domain-analysis/mini --repo tests/golden-mini
          python tools/check_reachability.py tests/golden-mini/domain-analysis/mini

  gepa-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements-dev.txt -r docs/evidence/gepa-bounded/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false
      - name: GEPA evaluator, search adapter and accounting red probes
        run: |
          python tools/selftest/test_gepa_eval.py
          python tools/selftest/test_gepa_budget.py
          python tools/selftest/test_gepa_search.py
          python tools/selftest/test_gepa_report.py
          python tools/selftest/test_gepa_rates.py
          python tools/selftest/test_gepa_discovery.py
          python tools/selftest/test_gepa_discovery_archive.py
          python tools/selftest/test_gepa_training_catalog.py
          python tools/selftest/test_gepa_training_evidence.py
          python tools/selftest/test_gepa_training_archive.py
          python tools/selftest/test_gepa_heldout.py
          python tools/selftest/test_gepa_heldout_diagnostic.py
          python tools/selftest/test_gepa_heldout_archive.py
      - name: independent reference replay and archived three-arm audit
        run: |
          python tools/verify_gepa_reference.py
          python tools/verify_gepa_quality.py
          python tools/gepa_report.py docs/evidence/gepa-bounded/runs
          python tools/gepa_cost_sensitivity.py docs/evidence/gepa-bounded/runs
          python tools/verify_gepa_discovery.py
          python tools/verify_gepa_training.py
          python tools/verify_gepa_heldout.py
      - name: GEPA discovery reference controls
        working-directory: docs/evidence/gepa-discovery/reference
        run: |
          go test -race -count=5 -timeout=20s -run '^(TestCondSignalBeforeWait|TestWaitGroupPositiveAddWhileActive)$' ./...
          GODEBUG=panicnil=1 go test -race -count=3 -timeout=20s -run '^TestWaitGroupGoPanicNilLegacy$' ./...
          go test -race -count=3 -timeout=20s -run '^TestWaitGroupSynctestOutsideWait$' ./...

      - name: GEPA held-out reference controls
        working-directory: docs/evidence/gepa-heldout/reference
        run: go test -race -count=3 -timeout=30s ./...
