; .vale.ini — the pack's own language policy, executable.
; Encodes the strictness matrix from STYLE.md ("Strictness by text class",
; "Tooling"): instructions to agents gate at error, descriptive prose gets
; the same rules at warning, records are exempt.
; CI gates on errors only: vale --minAlertLevel=error
;
; Design rule (learned the hard way): one explicit section per file class,
; no overlapping globs. Vale's glob matching is treacherous: [**.md] matches
; root-level files only, and **-fragments behave erratically across section
; orders. Exemptions live in .valeignore — an empty "BasedOnStyles =" does
; not exempt a file.
;
; Section order matters: for one file, later sections override earlier ones
; per property. The methods reference comes after the prompts section so its
; STE-flavored levels win for that one file.
;
; No section may contain `**`: in Vale 3.13 a **-fragment matches far beyond
; its intent and silently overrides every earlier section. Exemption works by
; non-matching: files that match no section (CHANGELOG.md, LICENSE, docs/,
; tools/ste-pack/) are not linted at all.
; Vale 3.13 reads BOTH .vale.ini and vale.ini and merges them. Keep exactly
; one config file: this one.

StylesPath = tools/ste-pack/styles
MinAlertLevel = suggestion
Vocab = Pack

; prompts/ = instructions to agents → strict class. Errors gate.
; STEDict (full core dictionary, data symlinked from ~/ste-private/ into
; tools/ste-pack/styles/config/dictionaries/) stays at warning: it informs,
; it does not gate. Semicolon stays at suggestion
; (STYLE.md, OPEN decision on Rule 8.1).
[prompts/*.md]
BasedOnStyles = STE, STEDict
STE.SentenceLength = error
STE.Passive = error
STE.EmDash = error
STE.BannedWords = error
STE.ParagraphLength = error
STE.Contractions = error
STE.Marketing = error
STE.ModalHedges = error
STE.PhrasalVerbs = error

; The methods reference is descriptive prose (STYLE.md: methodology
; references are STE-flavored). Same rules at warning.
[prompts/00-methods-reference.md]
BasedOnStyles = STE, STEDict
STE.SentenceLength = warning
STE.Passive = warning
STE.EmDash = warning
STE.BannedWords = warning
STE.ParagraphLength = warning
STE.Contractions = warning
STE.Marketing = warning
STE.ModalHedges = warning
STE.PhrasalVerbs = warning

; AGENTS.md = instructions to agents → strict class. Errors gate.
[AGENTS.md]
