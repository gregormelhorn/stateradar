; .vale.ini — the pack's own language policy, executable.
; Encodes the strictness matrix from STYLE.md ("Strictness by text class",
; "Tooling"): strict rules gate prompts/** at error, descriptive prose gets
; the same rules at warning, CHANGELOG.md is exempt (it is a record).
; CI gates on errors only: vale --minAlertLevel=error

StylesPath = tools/ste-pack/styles
MinAlertLevel = suggestion
Vocab = Pack

; prompts/ = instructions to agents → strict class. Errors gate.
; STEDict (full core dictionary, data symlinked from ~/ste-private/ into
; tools/ste-pack/styles/config/dictionaries/) stays at warning: it informs,
; it does not gate. Semicolon stays at suggestion
; (STYLE.md, OPEN decision on Rule 8.1).
[prompts/**.md]
BasedOnStyles = STE, STEDict
STE.SentenceLength = error
STE.Passive = error
STE.EmDash = error
STE.BannedWords = error
STE.ParagraphLength = error

; Descriptive prose (README, STYLE.md, docs) → STE-flavored: same rules,
; warnings inform.
[**.md]
BasedOnStyles = STE

; The changelog is a record. Exempt per STYLE.md.
[CHANGELOG.md]
BasedOnStyles =
