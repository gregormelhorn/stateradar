; Template for CONSUMER repositories (copy to the repo root as `.vale.ini`).
; Vale searches from the current directory upward and uses the first
; .vale.ini it finds. StylesPath is relative to this file's location —
; adjust it if your vendored pack path differs.

StylesPath = tools/prompt-pack/styles
MinAlertLevel = suggestion
Vocab = Pack

; Blind-consumed analysis artifacts are strict: a Part-B reader gets only
; this prose. Errors gate; warnings inform.
[**/event-catalogue.md]
BasedOnStyles = STE
STE.EmDash = error
STE.BannedWords = error

; Other analysis prose: STE-flavored.
[domain-analysis/**.md]
BasedOnStyles = STE

; Owner rationales live in decisions/*.yaml — Vale does not lint YAML by
; default, so recorded decisions stay untouched, as STYLE.md requires.
