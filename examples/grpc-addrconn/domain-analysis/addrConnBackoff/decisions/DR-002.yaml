  "title": "Remove cross-object lock inversion",
  "decision": "Snapshot cc.conns under cc.mu, release that lock, then reset each addrConn. Never acquire an ac lock while holding cc.mu; current ac-to-cc calls remain ordered. Recheck Shutdown in reset.",
  "rationale": "A snapshot plus terminal no-op closes the reset/state-update deadlock without making the public API unsafe.",
