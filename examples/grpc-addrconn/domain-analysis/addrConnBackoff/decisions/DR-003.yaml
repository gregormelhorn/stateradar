  "title": "Honor accepted connections and reset generations",
  "decision": "A SETTINGS-confirmed successful connection starts the next reconnect attempt without the stale pre-success delay. Explicit reset zeroes the failure history and advances a generation; the upcoming or current backoff wait must observe that generation atomically. A reset before wait registration cannot be lost. Subsequent failed attempts resume normal jittered backoff.",
  "rationale": "Recomputing a duration alone does not close the channel-generation lost-wakeup window. Success and explicit reset are distinct triggers.",
  "kind": "behavior-change",
  "scope": "StateRadar evaluation of grpc-go v1.18.0; not an upstream maintainer decision",
