  "title": "Separate missing first health status from stable watches",
  "decision": "Bound the first valid health response using a configurable first-verdict timeout, defaulting in this evaluation to the existing getMinConnectTimeout() duration. Expiry cancels that health attempt, releases its transport and enters ordinary reconnect/backoff. After a valid SERVING or NOT_SERVING status, silence alone is permitted; no heartbeat timeout or forced reconnect for stable NOT_SERVING. Keep the existing health client retry/backoff for ordinary stream failures. An unexpected terminal helper return while its context is live is a monitoring failure: remove Ready eligibility and restart monitoring with bounded backoff and the first-verdict timeout. UNIMPLEMENTED retains the explicitly documented healthy fallback; canceled or stale generations cannot change the active instance.",
  "rationale": "The callee retries ordinary stream errors itself. Blindly recycling on each stream error duplicates policy; stable watch silence is not the same as a missing initial verdict. New timeout and unexpected-return behavior are evaluation policy, not a claimed upstream requirement.",
