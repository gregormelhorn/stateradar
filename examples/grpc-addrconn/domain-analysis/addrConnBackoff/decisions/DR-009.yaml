  "title": "Ignore mutations on a terminal addrConn",
  "decision": "After Shutdown, resetConnectBackoff is a no-op. tryUpdateAddrs returns true without changing the address list, preserving the wrapper convention that an update to a retired instance does not recreate it. connect continues returning errConnClosing. The wrapper handles an empty address list as teardown; direct empty updates to live instances are rejected without mutation.",
  "rationale": "Returning false is not sufficient to promise recreation: the wrapper explicitly declines replacement when the old state is Shutdown. Preserve terminality without mutating dead context.",
  "kind": "behavior-change",
  "scope": "StateRadar evaluation of grpc-go v1.18.0; not an upstream maintainer decision",
