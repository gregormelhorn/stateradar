  "title": "Give local teardown explicit resource ownership",
  "decision": "Local teardown always cancels its owned dial/backoff/health activity, independently of parent ClientConn cancellation. A canceled backoff worker eventually exits and stops its timer; no fixed completion latency is promised. If a transport exists, detach it under lock; call GracefulClose for errConnDrain and Close for non-drain reasons outside ac.mu. Graceful drain may retain active RPCs; abrupt close terminates them. Late transports follow DR-001.",
  "rationale": "The transport lifetime is derived from cc.ctx, so the old NAT-5 inference from ac.cancel is invalid. Distinguish graceful drain from abrupt teardown and never call reentrant close callbacks under ac.mu. The current no-transport backoff path already satisfies this contract and is the F-09 slice.",
  "kind": "behavior-change",
