  "title": "Scope attempt cleanup to one attempt",
  "decision": "Restructure per-attempt ownership so its cancel is released on every exit path at the end of that attempt; use an attempt-scoped helper/defer or equivalently proven explicit cleanup. Do not accumulate deferred closures in the long-lived reconnect loop.",
  "rationale": "A helper with bounded lifetime is easier to audit than deleting the defer while assuming every early return is covered. Active health monitoring retains ownership until that attempt ends.",
