[[rules]]
id = "PA-21"
title = "lifecycle disagreement"
class = "fault-model"
statement = "shared state across independent lifecycles: a terminal state in one track must trigger cleanup in the other"
enforcement = "lint"
step5_order = 3
detects = ["F-07"]
added_by = "pack:v1.32 (valkey-glide #5803, python-websockets #1527)"
render = """
* **lifecycle disagreement (PA-21):** a state variable (counter, lock,
  flag) accessed from more than one independent lifecycle (caller vs.
  internal request, public API vs. background goroutine, user action vs.
  system cleanup). Model each lifecycle as a separate track. A terminal
  state in one lifecycle that does not trigger a cleanup transition in
  the shared resource track is a coupling bug. Flag terminal states
  missing cross-lifecycle cleanup transitions."""

[[rules]]
id = "PA-22"
title = "requirement-to-cell mapping"
class = "completeness"
statement = "every DOC-n requirement maps to ≥1 matrix cell; UNSPECIFIED there = violated, no cell = unimplemented"
enforcement = "checker"
checker_ref = "tools/dsc_check.py (doc-ids declaration ↔ docLines mapping totality)"
selftest_ref = "tools/selftest/run_selftest.py"
catches = "doctrine-line mapping totality (DOC-n → cell / invariant / rejected)"
catches_order = 18
detects = ["F-19"]
added_by = "pack:v1.32 (valkey-glide)"

[[rules]]
id = "PA-23"
title = "dual ownership cleanup"
class = "fault-model"
statement = "explicit release and implicit destructor are independent events; prove exactly-one logical release"
enforcement = "lint"
step5_order = 4
detects = ["F-08"]
added_by = "pack:v1.33 (Meilisearch #6578)"
render = """
* **dual ownership cleanup (PA-23):** an object with both an explicit
  release method (`close()`, `drop(self)`) and an implicit destructor
  (`Drop` impl, `__del__`, `defer`). Model both as independent events.
  If both can fire for the same instance, prove exactly-one logical
  release — the second path must be no-oppable, or one path must
  suppress the other."""

[[rules]]
id = "PA-24"
title = "async cancellation isolation"
class = "fault-model"
statement = "receiver-side terminal events need explicit sync transitions to the sender region — implicit sync does not cross channel boundaries"
enforcement = "lint"
step5_order = 5
detects = ["F-09"]
added_by = "pack:v1.33 (Meilisearch #6508)"
render = """
* **async cancellation isolation (PA-24):** a resource transferred to
  another task (channel sender, shared state) survives its original
  owner's cancellation. Model the sender-side and receiver-side
  lifecycles as separate orthogonal regions. A terminal event in one
  region must have an explicit synchronization transition to the
  other — implicit sync does not exist across channel boundaries."""

