# StateRadar rules registry — the single source for method rules.
#
# docs/plan-rules-registry.md is the design document. Edit THIS file,
# then run `python3 tools/gen_rules.py --write` to re-render every
# generated block (marked `<!-- generated:rules key=... -->`) in
# prompts/00-methods-reference.md, prompts/02-pilot.md, AGENTS.md and
# README.md. `python3 tools/gen_rules.py --check` (run by
# tools/check_pack_consistency.py) fails the build on drift.
#
# Rule fields:
#   id            stable identifier (PA-n from the methods reference,
#                 or R-* for rules that never had a PA number)
#   title         short human name
#   class         wellformedness | completeness | fault-model | process
#                 | empirical-pattern
#   statement     one-line normative text (rendered into 00's condensed list
#                 for PA-* ids)
#   enforcement   checker | test | lint | prompt | human | data
#   checker_ref   which deterministic check enforces it (enforcement=checker)
#   selftest_ref  red-case proof that the checker can fail. "TODO" is an
#                 explicit, warned-about backlog entry — never omit silently.
#   catches       verbatim line for the AGENTS §5 checker catalogue
#   catches_order position in that catalogue
#   render        verbatim markdown for the generated Step-5 lint block
#   step5_order   position in that block
#   lint_ref      where a lint rule lives when it is prose, not a bullet
#   detects       fault-class ids (F-xx) this rule can find (the ODC
#                 trigger→defect-type mapping; required for class=fault-model)
#   lineage       literature anchors
#   added_by      version / pilot that introduced the rule
#   checker_candidate  true = should become a checker; warned as backlog

# ---------------------------------------------------------------------------
# Closed vocabularies
# ---------------------------------------------------------------------------

[vocab]
dispositions = [
  "transition → <target>", "handle", "ignore (documented)",
  "ignore (accidental)", "defer (queued)", "reject", "UNSPECIFIED",
]
holes = ["ignore (accidental)", "UNSPECIFIED"]
question_status = ["OPEN", "ANSWERED", "RESOLVED", "CONFLICT"]
not_formalizable = ["external-call", "dynamic-state", "clock", "unstructured-payload"]
provenance = [
  "explicit-requirement", "observed-in-code", "observed-in-tests",
  "inferred", "proposed",
]
odc_triggers = [
  "step-1 extraction",
  "step-2 test replay",
  "step-3 checklist",
  "step-3 lock-discipline annotation",
  "step-4 matrix walk",
  "step-5 lint",
  "doctrine mapping",
  "seam-contract sweep",
  "pairs table + z3 proof",
  "adversarial trace",
  "multi-instance probes",
]

[vocab.disposition_defs]
"handle" = "stays in the state, does something"
"reject" = "a declared refusal signal: error, diagnostic, nack"

[render]
partb_vocab_tail = "Without these definitions a blind pass applies `reject` and `handle` to identical semantics interchangeably (dobby trigger-service, 2026-08-05: four vocabulary-only \"divergences\")."

