# Type checking for the pack's deterministic layer (CI: pack-ci "type check").
# Normal mode for every tool; the [mypy-<module>] sections below switch
# individual modules to strict checking, one file at a time.
[mypy]
python_version = 3.12
files = tools/*.py, tools/selftest/*.py
warn_unused_ignores = True
warn_redundant_casts = True

# z3-solver ships no type information.
[mypy-z3.*]
ignore_missing_imports = True

# Strict modules. Enable a module here once `mypy --strict` passes on it;
# per-module sections cannot say "strict = True", so the flags are listed.
[mypy-sidecar_types,gen_analysis_sidecar,local_models,local_budget,jev_local]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
disallow_untyped_decorators = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
