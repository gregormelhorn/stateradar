# Type checking for the pack's deterministic layer (CI: pack-ci "type check").
# Normal mode for every tool; the [mypy-<module>] sections below switch
# individual modules to strict checking, one file at a time.
[mypy]
python_version = 3.12
files = tools/*.py, tools/selftest/*.py
warn_unused_ignores = True
warn_redundant_casts = True

# z3-solver ships no type information.
[mypy-z3.*]
ignore_missing_imports = True
