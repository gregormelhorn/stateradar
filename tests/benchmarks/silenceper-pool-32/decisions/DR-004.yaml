id: DR-004
date: 2026-08-07
source_question: Q-04
question: Must a connection delivered to a queued Get() pass configured Ping validation?
options:
  - validate every Get() result; discard and retry when Ping fails
  - skip Ping for waiter-delivered connections
  - return the Ping error to the queued caller
  - defer
decision: validate every Get() result; discard and retry when Ping fails
rationale: Project owner selected option 1 after review of reconstructed upstream owner intent. Merged PR #6 defines configured Ping as connectivity validation and says invalid connections are discarded. This applies the same configured validation to the waiter-delivery path before Get() returns a connection.
links:
